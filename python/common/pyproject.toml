[project]
name = "driftwood-common"
version = "0.1.0"
description = "Code shared by the winnonah and questionnaires Python projects"
requires-python = ">=3.13"
dependencies = [
  "loguru>=0.7.3",
  "ratelimit>=2.2.1",
  "requests>=2.33.1",
  "tenacity>=9.1.2",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.12"]
build-backend = "uv_build"
