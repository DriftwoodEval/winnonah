[tools]
node = "22"
pnpm = "latest"
uv = "latest"

[env]
_.file = ".env"

[settings.task]
output = "interleave"

[tasks.deps]
description = "Spin up needed Docker containers for development"
run = "docker compose up -d driftwood-db redis cloudflared"

[tasks.down]
description = "Turn off Docker containers"
run = "docker compose down"

[tasks."python-dev"]
description = "Start the Python API with hot-reloading"
dir = "python"
run = "uv run uvicorn api:app --reload --port 8000"

[tasks."sync-db"]
description = "Sync the production database down to the local container"
shell = "bash -c"
run = """
set -o pipefail
log() { echo "[sync-db $(date +%H:%M:%S)] $1"; }

WAS_RUNNING="$(docker ps -q -f name=driftwood-db -f status=running)"
if [ -z "$WAS_RUNNING" ]; then
    log "Database container is not running. Starting driftwood-db..."
    docker compose up -d driftwood-db
    log "Waiting for database to become healthy..."
    while ! docker compose ps driftwood-db --format json | grep -q '"Health":"healthy"'; do
        sleep 0.5
    done
fi

log "Waiting for local database to accept connections..."
tries=0
until docker exec driftwood-db mysqladmin ping -h 127.0.0.1 -u root -p"${MYSQL_ROOT_PASSWORD}" --silent >/dev/null 2>&1; do
    tries=$((tries + 1))
    if [ "$tries" -ge 30 ]; then
        echo "[sync-db] ERROR: local database never became reachable over TCP after 15s" >&2
        exit 1
    fi
    sleep 0.5
done

DUMP_FILE="$(mktemp)"
trap 'rm -f "$DUMP_FILE"' EXIT

log "Connecting to opti over SSH and dumping to a local temp file..."
ssh -C -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 driftwood@opti \
    'echo "[sync-db remote] connected, starting mysqldump" >&2; cd winnonah && source .env && docker exec driftwood-db mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --events --set-gtid-purged=OFF driftwood; echo "[sync-db remote] mysqldump finished" >&2' \
    > "$DUMP_FILE" &
SSH_PID=$!

while kill -0 "$SSH_PID" 2>/dev/null; do
    sleep 3
    size="$(wc -c < "$DUMP_FILE" 2>/dev/null || echo 0)"
    log "...still transferring, ${size} bytes received so far"
done

if ! wait "$SSH_PID"; then
    echo "[sync-db] ERROR: ssh/mysqldump exited with a non-zero status" >&2
    exit 1
fi
log "Dump written ($(wc -c < "$DUMP_FILE") bytes). Importing into local container..."
docker exec -i driftwood-db mysql -h 127.0.0.1 -u root -p"${MYSQL_ROOT_PASSWORD}" driftwood < "$DUMP_FILE"
log "Database sync complete!"

if [ -z "$WAS_RUNNING" ]; then
    log "Shutting down automatically started database container..."
    docker compose stop driftwood-db
fi
"""

[tasks."db:studio"]
description = "Open Drizzle Studio against the local database"
shell = "bash -c"
run = """
docker compose up -d driftwood-db
while ! docker compose ps driftwood-db --format json | grep -q '"Health":"healthy"'; do
    sleep 0.5
done
pnpm db:studio
"""

[tasks."db:studio:remote"]
description = "Open Drizzle Studio against the production database over SSH"
run = "ssh -t -L 8282:localhost:8282 opti \"bash -ic 'cd winnonah && pnpm db:studio --port 8282'\""

[tasks."check:pnpm"]
description = "Type-check and lint TS"
run = "pnpm check"

[tasks."check:ruff"]
description = "Lint and format Python"
run = """
uvx ruff check python --fix
uvx ruff format python
"""

[tasks."check:changelog"]
description = "Validate changelog entry formatting and group ordering"
run = "pnpm exec tsx scripts/validate-changelog.ts"

[tasks.check]
description = "Type-check and lint everything (TS + Python)"
depends = ["check:pnpm", "check:ruff", "check:changelog"]

[tasks."test:python"]
description = "Run Python unit tests"
dir = "python"
run = "uv run pytest"

[tasks."test:python:html"]
description = "Run Python unit tests and generate an HTML coverage report in python/htmlcov"
dir = "python"
run = "uv run pytest --cov-report=html"

[tasks."test:python:integration"]
description = "Run Python integration tests against real external services (test data only, manual only)"
dir = "python"
run = "uv run pytest --run-integration -m integration -v"

[tasks."test:python:docker"]
description = "Build the Python Docker image's test stage from scratch (no cache, matching CI) and run pytest inside it"
dir = "python"
run = "docker build --pull --no-cache --target test -t winnonah-python-test . && docker run --rm -e HEADLESS=true winnonah-python-test"

[tasks."next-dev"]
description = "Start the Next.js dev server"
run = "pnpm dev"

[tasks.dev]
description = "Start development server, bringing up and installing dependencies first. Use --pull/--no-pull and --sync-db/--no-sync-db to skip the prompts."
depends = ["deps"]
shell = "bash -c"
usage = '''
flag "--pull" help="Pull latest changes from git before starting"
flag "--no-pull" help="Skip pulling latest changes"
flag "--sync-db" help="Sync database from production before starting"
flag "--no-sync-db" help="Skip syncing the database"
'''
run = """
pull="${usage_pull:-}"
[ -n "${usage_no_pull:-}" ] && pull="false"
if [ -z "$pull" ]; then
    read -p "Pull latest changes from git first? [Y/n] " pull_answer
    [[ "$pull_answer" =~ ^[Nn]$ ]] && pull="false" || pull="true"
fi
[ "$pull" = "true" ] && git pull

pnpm install

sync_db="${usage_sync_db:-}"
[ -n "${usage_no_sync_db:-}" ] && sync_db="false"
if [ -z "$sync_db" ]; then
    read -p "Sync database from production first? [y/N] " sync_answer
    [[ "$sync_answer" =~ ^[Yy]$ ]] && sync_db="true" || sync_db="false"
fi
[ "$sync_db" = "true" ] && mise run sync-db

trap "docker compose down" EXIT INT TERM
mise run python-dev &
mise run next-dev
"""
