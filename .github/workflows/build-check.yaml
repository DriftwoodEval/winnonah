name: Build Check

on:
  pull_request:
    branches:
      - main
  # Renovate uses branch automerge (no PR), so run the checks on the branch push
  # too. Without this, automerge-eligible updates wait forever on absent checks.
  push:
    branches:
      - renovate/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Knip (advisory)
        continue-on-error: true
        run: SKIP_ENV_VALIDATION=1 pnpm exec knip --no-exit-code

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-build-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-build-

      - name: Build
        run: SKIP_ENV_VALIDATION=1 pnpm build

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The job always reports success so it can stay a required check. The
      # slow steps below only run when Python code (or this workflow) changed,
      # and always run for pushes that have no PR base to diff against.
      - name: Check for Python changes
        id: python-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]] \
             || git diff --name-only "$BASE_SHA" "${{ github.sha }}" \
                | grep -qE '^(python/|\.github/workflows/build-check\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Python changes, skipping Python checks."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup mise (task runner only)
        if: steps.python-changes.outputs.run == 'true'
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Check Python version matches Dockerfile
        if: steps.python-changes.outputs.run == 'true'
        run: mise run check:python-version

      - name: Set up Docker Buildx
        if: steps.python-changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Python test image
        if: steps.python-changes.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./python
          file: ./python/Dockerfile
          target: test
          load: true
          tags: winnonah-python-test:ci
          # Read-only: the build on main writes the cache, so PRs skip the slow export.
          cache-from: type=gha

      - name: Run Python tests
        if: steps.python-changes.outputs.run == 'true'
        run: docker run --rm -e HEADLESS=true winnonah-python-test:ci
