name: Build Check

on:
  pull_request:
    branches:
      - main
  # Renovate uses branch automerge (no PR), so run the checks on the branch push
  # too. Without this, automerge-eligible updates wait forever on absent checks.
  push:
    branches:
      - renovate/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-build-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-build-

      - name: Build
        run: SKIP_ENV_VALIDATION=1 pnpm build

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Python test image
        uses: docker/build-push-action@v7
        with:
          context: ./python
          file: ./python/Dockerfile
          target: test
          load: true
          tags: winnonah-python-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Run Python tests
        run: docker run --rm -e HEADLESS=true winnonah-python-test:ci
