name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      build_node: ${{ steps.check_node_changes.outputs.build_triggered }}
      build_python: ${{ steps.check_python_changes.outputs.build_triggered }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47

      - name: Check for node changes
        id: check_node_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manually triggered, building both images regardless of changed files."
            echo "build_triggered=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "build_triggered=false" >> $GITHUB_OUTPUT
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ ! "$file" == python/* \
               && ! "$file" == worker/* \
               && ! "$file" == caddy/* \
               && ! "$file" == grafana/* \
               && ! "$file" == failover/* \
               && ! "$file" == mysql/* \
               && ! "$file" == drizzle/* \
               && ! "$file" == .github/* ]]; then
              echo "Detected change in '$file', triggering Node.js build."
              echo "build_triggered=true" >> $GITHUB_OUTPUT
              break
            fi
          done

      - name: Check for python changes
        id: check_python_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manually triggered, building both images regardless of changed files."
            echo "build_triggered=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "build_triggered=false" >> $GITHUB_OUTPUT
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" == python/* ]]; then
              echo "Detected change in '$file', triggering Python build."
              echo "build_triggered=true" >> $GITHUB_OUTPUT
              break
            fi
          done

  build-node:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.build_node == 'true'
    concurrency:
      group: build-node-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker build mounts
        id: cache-mounts
        uses: actions/cache@v4
        with:
          path: |
            .docker-cache/pnpm-store
            .docker-cache/next-cache
          key: docker-mounts-node-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            docker-mounts-node-${{ hashFiles('pnpm-lock.yaml') }}-
            docker-mounts-node-

      - name: Inject build mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".docker-cache/pnpm-store": { "target": "/pnpm/store", "id": "pnpm" },
              ".docker-cache/next-cache": { "target": "/app/.next/cache", "id": "nextjs" }
            }
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for main image
        id: meta-main
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build, test, and push main Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_COMMIT_HASH=${{ env.SHORT_SHA }}
            NEXT_PUBLIC_GIT_BRANCH=${{ github.ref_name }}
            NEXT_PUBLIC_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  build-python:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.build_python == 'true'
    concurrency:
      group: build-python-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Python test image
        uses: docker/build-push-action@v7
        with:
          context: ./python
          file: ./python/Dockerfile
          target: test
          load: true
          tags: winnonah-python-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Run Python tests
        run: docker run --rm -e HEADLESS=true winnonah-python-test:ci

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Python image
        id: meta-python
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-python
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Python Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./python
          file: ./python/Dockerfile
          push: true
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  delete-old-packages:
    runs-on: ubuntu-latest
    needs: [build-node, build-python]
    if: always() && (needs.build-node.result == 'success' || needs.build-python.result == 'success')
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: "winnonah"
          package-type: "container"
          min-versions-to-keep: 5

      - uses: actions/delete-package-versions@v5
        with:
          package-name: "winnonah-python"
          package-type: "container"
          min-versions-to-keep: 5

  deploy:
    runs-on: ubuntu-latest
    needs: [build-node, build-python]
    if: always() && (needs.build-node.result == 'success' || needs.build-python.result == 'success')
    steps:
      # Requires a Tailscale OAuth client with access to the primary host's
      # tailnet (secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # Watchtower's HTTP API is bound to primary's Tailscale IP only
      # (docker-compose.primary.yaml), so this is reachable over the
      # tailnet CI just joined, and nowhere else.
      - name: Trigger watchtower update
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" \
            "http://${{ secrets.WATCHTOWER_HOST }}:8080/v1/update"
